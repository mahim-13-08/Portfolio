<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0b0e13"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="url(#favGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Glow Tech Accent Line -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#20c997" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Stylized Monogram "NM" for Nashid Mahim -->
  <text x="32" y="40" fill="url(#favGrad)" font-family="'Poppins', 'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-1" text-anchor="middle">NM</text>
  
  <!-- Tech Dot in corner -->
  <circle cx="49" cy="20" r="3" fill="#20c997"/>
</svg>
