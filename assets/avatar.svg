<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d99b79"/>
      <stop offset="100%" stop-color="#b87b58"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2633"/>
      <stop offset="100%" stop-color="#161b24"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c202a"/>
      <stop offset="100%" stop-color="#0d1015"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="160" cy="160" r="156" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="4" />

  <!-- Subtle Tech Grid Lines in Background -->
  <g opacity="0.12" stroke="#20c997" stroke-width="1.2">
    <line x1="40" y1="160" x2="280" y2="160" stroke-dasharray="4 6"/>
    <line x1="160" y1="40" x2="160" y2="280" stroke-dasharray="4 6"/>
    <circle cx="160" cy="160" r="110" fill="none" stroke-dasharray="6 8"/>
  </g>

  <!-- Torso & Hoodie -->
  <path d="M70 295 C85 240, 115 220, 160 220 C205 220, 235 240, 250 295 Z" fill="url(#clothGrad)" stroke="#2b3445" stroke-width="2"/>
  
  <!-- Hoodie Collar & Accent Trim -->
  <path d="M125 220 Q160 250 195 220 Q160 270 125 220" fill="#131720" stroke="url(#accentGrad)" stroke-width="2"/>
  <path d="M145 245 L145 285" stroke="#20c997" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M175 245 L175 285" stroke="#20c997" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Neck -->
  <rect x="142" y="180" width="36" height="42" rx="10" fill="url(#skinGrad)" opacity="0.95"/>
  <path d="M142 195 Q160 205 178 195" fill="none" stroke="#9e6745" stroke-width="2"/>

  <!-- Head / Face -->
  <ellipse cx="160" cy="148" rx="46" ry="54" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="112" cy="150" rx="9" ry="14" fill="url(#skinGrad)"/>
  <ellipse cx="208" cy="150" rx="9" ry="14" fill="url(#skinGrad)"/>

  <!-- Modern Hair Style -->
  <path d="M110 140 C110 95, 135 80, 160 80 C190 80, 212 95, 212 135 C205 110, 185 102, 160 102 C135 102, 118 118, 110 140 Z" fill="url(#hairGrad)"/>
  <path d="M130 92 Q165 72 196 92" stroke="#20c997" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Eyes & Eyebrows -->
  <path d="M130 128 Q142 124 150 128" stroke="#1c202a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 128 Q178 124 190 128" stroke="#1c202a" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <ellipse cx="140" cy="142" rx="4" ry="4" fill="#141820"/>
  <circle cx="141" cy="140" r="1.5" fill="#ffffff"/>
  <ellipse cx="180" cy="142" rx="4" ry="4" fill="#141820"/>
  <circle cx="181" cy="140" r="1.5" fill="#ffffff"/>

  <!-- Modern Tech Developer Glasses -->
  <rect x="126" y="132" width="28" height="20" rx="6" fill="rgba(32, 201, 151, 0.08)" stroke="#20c997" stroke-width="2"/>
  <rect x="166" y="132" width="28" height="20" rx="6" fill="rgba(32, 201, 151, 0.08)" stroke="#20c997" stroke-width="2"/>
  <line x1="154" y1="140" x2="166" y2="140" stroke="#20c997" stroke-width="2"/>
  <line x1="114" y1="138" x2="126" y2="140" stroke="#20c997" stroke-width="2"/>
  <line x1="194" y1="140" x2="206" y2="138" stroke="#20c997" stroke-width="2"/>

  <!-- Nose & Smile -->
  <path d="M158 146 L156 160 L164 160" stroke="#9e6745" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M148 174 Q160 184 172 174" stroke="#7d4e33" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Floating Tech Initials Tag -->
  <g transform="translate(195, 230)" filter="url(#glow)">
    <rect width="65" height="24" rx="12" fill="#111418" stroke="#20c997" stroke-width="1.5"/>
    <text x="32" y="16" fill="#20c997" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;DEV/&gt;</text>
  </g>
</svg>
