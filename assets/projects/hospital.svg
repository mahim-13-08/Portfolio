<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141f"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="windowHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#hBg)"/>

  <!-- Native Desktop Application Frame -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="url(#windowHeader)"/>
  <rect x="0" y="24" width="800" height="18" fill="url(#windowHeader)"/>

  <!-- Windows/Java Swing Desktop Controls -->
  <circle cx="28" cy="21" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="5" fill="#27c93f"/>

  <!-- Application Title Bar -->
  <text x="400" y="26" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">CareMatrix HMS v2.4 · Java Swing &amp; MySQL Desktop Client</text>

  <!-- Tech Badge -->
  <rect x="680" y="9" width="95" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="727" y="25" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">Java · MySQL</text>

  <!-- Desktop App Menu Bar (File, Edit, Patients, Doctors, Database, Help) -->
  <rect x="0" y="42" width="800" height="30" fill="#151b27" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="24" y="62" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">File</text>
  <text x="64" y="62" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Patient Registry</text>
  <text x="174" y="62" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Appointments</text>
  <text x="274" y="62" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Doctors &amp; Staff</text>
  <text x="384" y="62" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Billing &amp; Pharmacy</text>
  <text x="510" y="62" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">● DB Connected (MySQL 3306)</text>

  <!-- Left Sidebar / Modules Tree -->
  <g transform="translate(20, 84)">
    <rect width="200" height="396" rx="10" fill="#121722" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Clinic Header -->
    <g transform="translate(16, 16)">
      <!-- Medical Cross Logo -->
      <rect x="0" y="10" width="32" height="12" rx="3" fill="url(#crossGrad)"/>
      <rect x="10" y="0" width="12" height="32" rx="3" fill="url(#crossGrad)"/>
      <text x="42" y="18" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">HealthLink</text>
      <text x="42" y="32" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">OOP ARCHITECTURE</text>
    </g>

    <!-- Nav Items -->
    <rect x="12" y="70" width="176" height="36" rx="8" fill="#20c997"/>
    <text x="32" y="93" fill="#061e16" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">🏥 Patient Records</text>

    <text x="32" y="136" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">📅 Doctor Schedules</text>
    <text x="32" y="174" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">💊 Prescriptions</text>
    <text x="32" y="212" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">🛏 Ward / Bed Status</text>
    <text x="32" y="250" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">💳 Billing &amp; Invoices</text>

    <!-- OOP Classes Indicator -->
    <rect x="12" y="280" width="176" height="100" rx="8" fill="#18202d"/>
    <text x="24" y="302" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold">&lt;Java OOP Design&gt;</text>
    <text x="24" y="324" fill="#a0aec0" font-family="'Segoe UI', monospace" font-size="10">• class Patient extends Person</text>
    <text x="24" y="342" fill="#a0aec0" font-family="'Segoe UI', monospace" font-size="10">• class Doctor extends Staff</text>
    <text x="24" y="360" fill="#a0aec0" font-family="'Segoe UI', monospace" font-size="10">• class AppointmentManager</text>
  </g>

  <!-- Right Dashboard Content -->
  <!-- Quick Stat Cards -->
  <g transform="translate(235, 84)">
    <rect width="170" height="70" rx="10" fill="#141a24" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Total Admitted</text>
    <text x="16" y="54" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">142 Patients</text>

    <g transform="translate(185, 0)">
      <rect width="170" height="70" rx="10" fill="#141a24" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Today's Appointments</text>
      <text x="16" y="54" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">38 Scheduled</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="175" height="70" rx="10" fill="#141a24" stroke="rgba(255,255,255,0.06)"/>
      <text x="16" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Doctors On Duty</text>
      <text x="16" y="54" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">18 Physicians</text>
    </g>
  </g>

  <!-- Main Patient Database Table -->
  <g transform="translate(235, 168)">
    <rect width="545" height="312" rx="10" fill="#121722" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Table Header Tools -->
    <text x="20" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Active In-Patient Registry</text>
    
    <rect x="360" y="14" width="165" height="28" rx="6" fill="#1b2332" stroke="rgba(255,255,255,0.08)"/>
    <text x="375" y="32" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Search MRN / Name...</text>

    <!-- Table Columns -->
    <rect x="14" y="52" width="517" height="28" rx="4" fill="#1c2534"/>
    <text x="26" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">MRN</text>
    <text x="80" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PATIENT NAME</text>
    <text x="205" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">DEPARTMENT</text>
    <text x="320" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">ATTENDING DR.</text>
    <text x="445" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <text x="26" y="105" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11">#P-8821</text>
    <text x="80" y="105" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Rafiqul Islam</text>
    <text x="205" y="105" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Cardiology</text>
    <text x="320" y="105" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Dr. Hasan Mahmud</text>
    <rect x="440" y="93" width="75" height="18" rx="4" fill="rgba(32, 201, 151, 0.15)"/>
    <text x="452" y="106" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">ADMITTED</text>

    <!-- Row 2 -->
    <line x1="14" y1="120" x2="531" y2="120" stroke="rgba(255,255,255,0.04)"/>
    <text x="26" y="145" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11">#P-8822</text>
    <text x="80" y="145" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Fatima Begum</text>
    <text x="205" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Neurology</text>
    <text x="320" y="145" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Dr. Sharmin Akter</text>
    <rect x="440" y="133" width="75" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="454" y="146" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">PENDING</text>

    <!-- Row 3 -->
    <line x1="14" y1="160" x2="531" y2="160" stroke="rgba(255,255,255,0.04)"/>
    <text x="26" y="185" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11">#P-8823</text>
    <text x="80" y="185" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Kamal Hossain</text>
    <text x="205" y="185" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Orthopedics</text>
    <text x="320" y="185" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="12">Dr. Farhan Reza</text>
    <rect x="440" y="173" width="75" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="452" y="186" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">IN SURGERY</text>

    <!-- SQL Persistence Status Box at Bottom -->
    <rect x="14" y="215" width="517" height="82" rx="6" fill="#161f2c"/>
    <text x="26" y="238" fill="#20c997" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold">JDBC Connection Pool Status: Active</text>
    <text x="26" y="258" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="10">SELECT p.id, p.name, a.slot, d.name FROM patients p JOIN appointments a ON p.id = a.pid;</text>
    <text x="26" y="278" fill="#64748b" font-family="'Segoe UI', monospace" font-size="10">Transactions atomic, prepared statements utilized against SQL injection vulnerability.</text>
  </g>
</svg>
