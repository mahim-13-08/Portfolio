<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202c"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2838"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#mBg)"/>

  <!-- Browser / App Header Bar -->
  <rect x="0" y="0" width="800" height="48" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="32" width="800" height="16" fill="url(#headerGrad)"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="24" r="6" fill="#27c93f"/>

  <!-- Search / URL Bar -->
  <rect x="180" y="10" width="440" height="28" rx="14" fill="#0b0f15" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="320" y="28" fill="#718096" font-family="'Segoe UI', system-ui, sans-serif" font-size="12">bracu-marketplace.internal/listings</text>
  <circle cx="202" cy="24" r="5" fill="none" stroke="#20c997" stroke-width="1.8"/>
  <line x1="206" y1="28" x2="212" y2="34" stroke="#20c997" stroke-width="1.8"/>

  <!-- Stack Tag Badge -->
  <rect x="680" y="12" width="95" height="24" rx="6" fill="rgba(32, 201, 151, 0.15)" stroke="#20c997" stroke-width="1"/>
  <text x="727" y="28" fill="#20c997" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" text-anchor="middle">MERN STACK</text>

  <!-- Navigation / Filter Bar inside App -->
  <rect x="30" y="66" width="740" height="52" rx="10" fill="#141a24" stroke="rgba(255,255,255,0.05)"/>
  <text x="50" y="98" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">Campus Secondhand Hub</text>
  
  <!-- Filter Pills -->
  <rect x="360" y="78" width="70" height="28" rx="14" fill="#20c997"/>
  <text x="395" y="96" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">All Items</text>
  
  <rect x="440" y="78" width="85" height="28" rx="14" fill="#1a2230" stroke="rgba(255,255,255,0.08)"/>
  <text x="482" y="96" fill="#a0aec0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Textbooks</text>

  <rect x="535" y="78" width="95" height="28" rx="14" fill="#1a2230" stroke="rgba(255,255,255,0.08)"/>
  <text x="582" y="96" fill="#a0aec0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Electronics</text>

  <rect x="640" y="78" width="110" height="28" rx="14" fill="rgba(32,201,151,0.1)" stroke="#20c997"/>
  <text x="695" y="96" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Sell Item</text>

  <!-- Product Grid: 3 Cards -->
  <!-- Card 1 -->
  <g transform="translate(30, 138)">
    <rect width="230" height="330" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Image placeholder -->
    <rect x="12" y="12" width="206" height="150" rx="8" fill="#1e2736"/>
    <!-- Icon/Illustration of Book -->
    <path d="M75 60 C90 55, 115 55, 115 130 C115 55, 140 55, 155 60 L155 125 C140 120, 115 120, 115 135 C115 120, 90 120, 75 125 Z" fill="#20c997" opacity="0.35"/>
    <path d="M115 60 L115 132" stroke="#20c997" stroke-width="2"/>
    <rect x="22" y="22" width="60" height="20" rx="4" fill="rgba(32,201,151,0.2)"/>
    <text x="52" y="36" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CSE220</text>
    
    <!-- Content -->
    <text x="14" y="186" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Data Structures &amp; Algos</text>
    <text x="14" y="206" fill="#a0aec0" font-family="'Segoe UI', sans-serif" font-size="11">Hardcover · Excellent Condition</text>
    <text x="14" y="235" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">BDT 450</text>
    <text x="86" y="234" fill="#718096" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">BDT 900</text>

    <!-- Seller info & button -->
    <line x1="14" y1="255" x2="216" y2="255" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="26" cy="285" r="10" fill="#2d3748"/>
    <text x="42" y="289" fill="#cbd5e0" font-family="'Segoe UI', sans-serif" font-size="11">BRACU CSE Junior</text>
    <rect x="14" y="302" width="202" height="20" rx="6" fill="#20c997" opacity="0.9"/>
    <text x="115" y="316" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Contact Seller via Chat</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(285, 138)">
    <rect width="230" height="330" rx="12" fill="url(#cardGrad)" stroke="rgba(32, 201, 151, 0.3)" stroke-width="1.5"/>
    <rect x="12" y="12" width="206" height="150" rx="8" fill="#1e2736"/>
    <!-- Calculator / Gadget vector -->
    <rect x="80" y="45" width="70" height="90" rx="8" fill="#121722" stroke="#20c997" stroke-width="2"/>
    <rect x="90" y="55" width="50" height="22" rx="3" fill="#20c997" opacity="0.3"/>
    <circle cx="96" cy="90" r="3.5" fill="#a0aec0"/>
    <circle cx="115" cy="90" r="3.5" fill="#a0aec0"/>
    <circle cx="134" cy="90" r="3.5" fill="#a0aec0"/>
    <circle cx="96" cy="105" r="3.5" fill="#a0aec0"/>
    <circle cx="115" cy="105" r="3.5" fill="#a0aec0"/>
    <circle cx="134" cy="105" r="3.5" fill="#20c997"/>

    <rect x="22" y="22" width="75" height="20" rx="4" fill="rgba(0,180,216,0.2)"/>
    <text x="59" y="36" fill="#00b4d8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ELECTRONICS</text>

    <text x="14" y="186" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Casio fx-991EX ClassWiz</text>
    <text x="14" y="206" fill="#a0aec0" font-family="'Segoe UI', sans-serif" font-size="11">Scientific Calc · Original Box</text>
    <text x="14" y="235" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">BDT 1,400</text>
    <text x="105" y="234" fill="#718096" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">BDT 2,200</text>

    <line x1="14" y1="255" x2="216" y2="255" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="26" cy="285" r="10" fill="#2d3748"/>
    <text x="42" y="289" fill="#cbd5e0" font-family="'Segoe UI', sans-serif" font-size="11">BRACU EEE Senior</text>
    <rect x="14" y="302" width="202" height="20" rx="6" fill="#20c997"/>
    <text x="115" y="316" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Buy Now / Escrow</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(540, 138)">
    <rect width="230" height="330" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="12" y="12" width="206" height="150" rx="8" fill="#1e2736"/>
    <!-- Arduino / Kit vector -->
    <rect x="65" y="55" width="100" height="70" rx="6" fill="#101e18" stroke="#20c997" stroke-width="1.5"/>
    <circle cx="85" cy="72" r="6" fill="#ffbd2e"/>
    <circle cx="145" cy="72" r="6" fill="#27c93f"/>
    <rect x="95" y="80" width="40" height="30" rx="4" fill="#1a202c"/>
    <text x="115" y="99" fill="#20c997" font-family="'Segoe UI', monospace" font-size="9" text-anchor="middle">ATMega</text>

    <rect x="22" y="22" width="65" height="20" rx="4" fill="rgba(255,159,67,0.2)"/>
    <text x="54" y="36" fill="#ff9f43" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LAB KIT</text>

    <text x="14" y="186" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">Arduino Uno Complete Kit</text>
    <text x="14" y="206" fill="#a0aec0" font-family="'Segoe UI', sans-serif" font-size="11">Breadboard + 30+ Sensors</text>
    <text x="14" y="235" fill="#20c997" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">BDT 850</text>
    <text x="95" y="234" fill="#718096" font-family="'Segoe UI', sans-serif" font-size="12" text-decoration="line-through">BDT 1,500</text>

    <line x1="14" y1="255" x2="216" y2="255" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="26" cy="285" r="10" fill="#2d3748"/>
    <text x="42" y="289" fill="#cbd5e0" font-family="'Segoe UI', sans-serif" font-size="11">BRACU Robotics Club</text>
    <rect x="14" y="302" width="202" height="20" rx="6" fill="#20c997" opacity="0.9"/>
    <text x="115" y="316" fill="#071b14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Contact Seller via Chat</text>
  </g>
</svg>
